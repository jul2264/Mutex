spring:
  application:
    name: mutex-bi
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:mutex_bi}?reWriteBatchedInserts=true
    username: ${DB_USER:mutex_user}
    password: ${DB_PASSWORD:mutex_password_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 1000
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  import:
    max-file-size-bytes: 10485760
    max-rows: 100000
    max-columns: 50
    batch-size: 1000
    timeout-seconds: 120
    max-stored-issues: 10000

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

