name: Mutex CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Verify (Java 21, Testcontainers, PostgreSQL 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests & Verify
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean verify -B

  frontend:
    name: Frontend Quality Checks & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linting
        run: |
          cd frontend
          npm run lint

      - name: Run Type Checking
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vitest Unit & API Tests
        run: |
          cd frontend
          npm run test

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build
