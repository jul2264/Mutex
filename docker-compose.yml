services:
  db:
    image: postgres:17-alpine
    container_name: mutex_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mutex_bi}
      POSTGRES_USER: ${POSTGRES_USER:-mutex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mutex_password_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mutex_user} -d ${POSTGRES_DB:-mutex_bi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mutex_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mutex_bi}?reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mutex_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mutex_password_dev}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_FORWARD_HEADERS_STRATEGY: native
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mutex_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  db-data:
    name: mutex_db_data
